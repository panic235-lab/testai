<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>대원 앱 로그인 - 인력동원상황실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    --bg: oklch(0.97 0.004 250);
    --bg-card: oklch(1 0 0);
    --bg-muted: oklch(0.955 0.006 250);
    --border: oklch(0.885 0.008 250);
    --text: oklch(0.22 0.02 250);
    --text-dim: oklch(0.48 0.015 250);
    --text-faint: oklch(0.62 0.012 250);
    --blue: oklch(0.56 0.16 240);
    --amber: oklch(0.68 0.15 80);
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  }
  a { color: var(--blue); text-decoration: none; }
  .field { background: var(--bg-muted); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 13px 14px; font-size: 14px; font-family: inherit; outline: none; width: 100%; }
  .field::placeholder { color: var(--text-faint); }
  .field:focus { border-color: var(--blue); background: var(--bg-card); }
  .btn { font-family: inherit; cursor: pointer; border: none; border-radius: 11px; font-weight: 700; }
  .btn:disabled { opacity: .6; }
  .wrap { max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .error-box { display:none; margin-top:12px; background: oklch(0.92 0.08 25); color: oklch(0.42 0.14 25); border-radius:8px; padding:10px 12px; font-size:12px; }
  .error-box.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 28px;">

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:36px;">
      <div style="width:64px; height:64px; border-radius:18px; background:var(--blue); display:flex; align-items:center; justify-content:center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 2 L21 6 V12 C21 17 17 20.5 12 22 C7 20.5 3 17 3 12 V6 Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div style="text-align:center;">
        <div style="font-size:18px; font-weight:800;">대원 앱</div>
        <div style="font-size:12px; color:var(--text-faint); margin-top:2px;">인력동원상황실</div>
      </div>
    </div>

    <form id="loginForm" style="display:flex; flex-direction:column; gap:12px;">
      <input class="field" id="id" type="text" placeholder="아이디" autocomplete="username" required/>
      <div style="position:relative;">
        <input class="field" id="password" type="password" placeholder="비밀번호" autocomplete="current-password" style="padding-right:44px;" required/>
        <button type="button" id="togglePw" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-faint); padding:4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <button class="btn" type="submit" id="submitBtn" style="width:100%; padding:15px; background:var(--blue); color:#fff; font-size:14.5px; margin-top:4px;">로그인</button>
      <div class="error-box" id="errorBox"></div>
    </form>

    <div style="display:flex; gap:8px; margin-top:16px; padding:12px 14px; background:oklch(0.94 0.03 240); border-radius:10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; margin-top:1px;"><circle cx="12" cy="12" r="10" stroke="var(--blue)" stroke-width="1.6"/><path d="M12 8v.1M12 11v5" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div style="font-size:11px; color:oklch(0.4 0.1 240); line-height:1.55;">최초 로그인 시 이 기기가 자동으로 본인 계정에 등록됩니다. 이후 응소는 등록된 본인 기기에서만 인정됩니다.</div>
    </div>

    <div style="text-align:center; margin-top:22px;">
      <div style="font-size:11.5px; color:var(--text-faint); margin-bottom:6px;">다른 기기로 로그인하셨나요?</div>
      <a href="/app-device-register.html" style="font-size:13px; font-weight:700;">새 기기 등록하기 →</a>
    </div>
  </div>

  <div style="text-align:center; font-size:10.5px; color:var(--text-faint); padding-bottom:22px;">기기 바인딩 · 개별 계정 로그인</div>
</div>
<script src="/js/device-id.js"></script>
<script>
document.getElementById('togglePw').addEventListener('click', () => {
  const input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorBox');
  const btn = document.getElementById('submitBtn');
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '로그인 중...';
  try {
    const res = await fetch('/api/auth/app-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: document.getElementById('id').value.trim(),
        password: document.getElementById('password').value,
        deviceId: getDeviceId(),
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      if (data.code === 'DEVICE_MISMATCH') {
        errorBox.innerHTML = data.error + ' <a href="/app-device-register.html">새 기기 등록하기 →</a>';
        errorBox.classList.add('show');
        return;
      }
      throw new Error(data.error || '로그인에 실패했습니다.');
    }
    window.location.href = '/app-home.html';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '로그인';
  }
});
</script>
</body>
</html>

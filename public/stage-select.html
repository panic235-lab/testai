<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>상황단계 선택 - 인력동원상황실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    --bg: oklch(0.17 0.02 250);
    --bg-panel: oklch(0.225 0.026 250);
    --border: oklch(0.34 0.03 250);
    --text: oklch(0.96 0.01 250);
    --text-dim: oklch(0.7 0.02 250);
    --text-faint: oklch(0.5 0.02 250);
    --blue: oklch(0.68 0.15 240);
    background: var(--bg); color: var(--text); position: relative;
    font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  a { color: var(--blue); text-decoration: none; }
  .origin-chip { border-radius: 999px; padding: 9px 20px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--border); font-family: inherit; background: transparent; color: var(--text-dim); }
  .origin-chip.active { background: var(--blue); border-color: var(--blue); color: oklch(0.14 0.02 250); }
  .stage-card { border-radius: 12px; padding: 24px 26px; display: flex; align-items: center; gap: 18px; cursor: pointer; transition: border-color .15s, background .15s; background: var(--bg-panel); border: 1.5px solid var(--border); }
  .stage-card.active { background: oklch(0.27 0.06 240); border-color: var(--blue); }
  .stage-card.disabled { opacity: .45; pointer-events: none; }
  .next-btn { border: none; border-radius: 8px; padding: 15px 44px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .back-btn { background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:5px; }
  .back-btn:hover { color: var(--text); }
</style>
</head>
<body>
  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 40px; border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2 L21 6 V12 C21 17 17 20.5 12 22 C7 20.5 3 17 3 12 V6 Z" stroke="var(--blue)" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div style="font-size:14px; font-weight:700;">인력동원상황실</div>
    </div>
    <span id="whoami" style="font-size:12px; color:var(--text-faint); border:1px solid var(--border); border-radius:6px; padding:5px 10px;">-</span>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; position:relative;">
    <button class="back-btn" id="backBtn" style="position:absolute; left:40px; top:12px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      초기화면으로
    </button>

    <div style="text-align:center;">
      <div style="font-size:13px; color:var(--text-faint); margin-bottom:8px;">상황단계 선택</div>
      <div id="origins" style="display:flex; gap:10px; justify-content:center;"></div>
    </div>

    <div id="stages" style="width:560px; display:flex; flex-direction:column; gap:14px;"></div>

    <button class="next-btn" id="nextBtn">동원명령 발령 화면으로</button>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let originButtons = [];
let stagesByOrigin = {};
let origin = qs.get('origin') || 'fire';
let stage = null;

function renderOrigins() {
  $('origins').innerHTML = originButtons.map((o) => `<button class="origin-chip ${o.id === origin ? 'active' : ''}" data-id="${o.id}">${o.label}</button>`).join('');
  $('origins').querySelectorAll('[data-id]').forEach((el) => {
    el.addEventListener('click', () => { origin = el.dataset.id; stage = null; renderOrigins(); renderStages(); });
  });
}

function renderStages() {
  const items = stagesByOrigin[origin] || [];
  const list = items.length ? items : [{ name: '(관리자가 등록한 상황단계가 없습니다)', disabled: true }];
  $('stages').innerHTML = list.map((s) => {
    const disabled = !!s.disabled;
    const active = !disabled && stage === s.name;
    return `<div class="stage-card ${active ? 'active' : ''} ${disabled ? 'disabled' : ''}" data-name="${s.name}">
      <div style="width:44px; height:44px; border-radius:10px; background:${active ? 'oklch(0.34 0.09 240)' : 'oklch(0.28 0.02 250)'}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v4M12 17v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M3 12h4M17 12h4M4.2 19.8L7 17M17 7l2.8-2.8" stroke="${active ? 'oklch(0.85 0.1 240)' : 'oklch(0.6 0.02 250)'}" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px; font-weight:700;">${s.name}</div>
        <div style="font-size:12px; color:var(--text-faint); margin-top:2px;">${disabled ? '상황판 설정에서 항목을 추가해 주세요' : '동원명령 발령 시 이 단계로 기록됩니다'}</div>
      </div>
      ${active ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="var(--blue)"/><path d="M8 12l3 3 5-6" stroke="oklch(0.14 0.02 250)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
    </div>`;
  }).join('');
  if (!list[0].disabled) {
    $('stages').querySelectorAll('[data-name]').forEach((el) => {
      el.addEventListener('click', () => { stage = el.dataset.name; renderStages(); updateNext(); });
    });
  }
  updateNext();
}

function updateNext() {
  const canGo = !!stage;
  $('nextBtn').style.background = canGo ? 'var(--blue)' : 'oklch(0.24 0.02 250)';
  $('nextBtn').style.color = canGo ? 'oklch(0.14 0.02 250)' : 'var(--text-faint)';
  $('nextBtn').style.opacity = canGo ? '1' : '0.6';
  $('nextBtn').disabled = !canGo;
}

$('nextBtn').addEventListener('click', () => {
  if (!stage) return;
  window.location.href = `/dashboard.html?origin=${encodeURIComponent(origin)}&stage=${encodeURIComponent(stage)}`;
});
$('backBtn').addEventListener('click', () => { window.location.href = '/home.html'; });

async function init() {
  const meRes = await fetch('/api/auth/me');
  const me = await meRes.json();
  if (!me.authenticated) { window.location.href = '/login.html'; return; }
  $('whoami').textContent = me.role === 'admin' ? `관리자${me.adminName ? ' · ' + me.adminName : ''}` : '상황실근무자';

  const res = await fetch('/api/control/settings');
  if (res.status === 401) { window.location.href = '/login.html'; return; }
  const data = await res.json();
  originButtons = data.originButtons;
  stagesByOrigin = data.stagesByOrigin;
  renderOrigins();
  renderStages();
}
init();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>새 기기 등록 - 인력동원상황실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    --bg: oklch(0.97 0.004 250);
    --bg-card: oklch(1 0 0);
    --bg-muted: oklch(0.955 0.006 250);
    --border: oklch(0.885 0.008 250);
    --text: oklch(0.22 0.02 250);
    --text-dim: oklch(0.48 0.015 250);
    --text-faint: oklch(0.62 0.012 250);
    --blue: oklch(0.56 0.16 240);
    --amber: oklch(0.68 0.15 80);
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  }
  a { color: var(--blue); text-decoration: none; }
  .field { background: var(--bg-muted); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 13px 14px; font-size: 14px; font-family: inherit; outline: none; width: 100%; }
  .field::placeholder { color: var(--text-faint); }
  .field:focus { border-color: var(--blue); background: var(--bg-card); }
  .btn { font-family: inherit; cursor: pointer; border: none; border-radius: 11px; font-weight: 700; }
  .label { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 6px; }
  .wrap { max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .error-box { display:none; margin-top:6px; background: oklch(0.92 0.08 25); color: oklch(0.42 0.14 25); border-radius:8px; padding:10px 12px; font-size:12px; }
  .error-box.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; align-items:center; gap:10px; padding:18px 20px 6px; flex-shrink:0;">
    <a href="/app-login.html" style="color:var(--text-faint); display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div style="font-size:14px; font-weight:700;">새 기기 등록</div>
  </div>

  <form id="registerForm" style="flex:1; overflow-y:auto; padding:14px 20px 20px; display:flex; flex-direction:column; gap:16px;">
    <div style="font-size:12px; color:var(--text-faint); line-height:1.6;">분실·교체 등으로 새 기기에서 다시 등록해야 할 때 사용합니다. 관리자에게 발급받은 기기등록코드가 필요합니다.</div>

    <div>
      <div class="label">아이디</div>
      <input class="field" id="id" type="text" placeholder="대원 앱 아이디" autocomplete="username" required/>
    </div>

    <div>
      <div class="label">비밀번호</div>
      <input class="field" id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required/>
    </div>

    <div>
      <div class="label">기기등록코드</div>
      <input class="field" id="code" style="letter-spacing:0.08em; font-family:'Courier New',monospace; text-transform:uppercase;" placeholder="XXXX-XXXX" required/>
    </div>

    <div style="display:flex; gap:9px; padding:13px 14px; background:oklch(0.95 0.03 25); border-radius:10px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; margin-top:1px;"><path d="M12 3l10 18H2L12 3z" stroke="oklch(0.5 0.15 25)" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10v4M12 16.5v.1" stroke="oklch(0.5 0.15 25)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div style="font-size:11px; color:oklch(0.42 0.13 25); line-height:1.6;">등록을 완료하면 기존에 등록되어 있던 기기는 자동으로 해제됩니다 (계정당 1대만 등록 가능).</div>
    </div>

    <button class="btn" type="submit" id="submitBtn" style="width:100%; padding:15px; background:var(--blue); color:#fff; font-size:14.5px;">등록 완료</button>
    <div class="error-box" id="errorBox"></div>
  </form>
</div>
<script src="/js/device-id.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorBox');
  const btn = document.getElementById('submitBtn');
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '등록 중...';
  try {
    const res = await fetch('/api/auth/app-register-device', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: document.getElementById('id').value.trim(),
        password: document.getElementById('password').value,
        code: document.getElementById('code').value.trim(),
        deviceId: getDeviceId(),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '등록에 실패했습니다.');
    window.location.href = '/app-home.html';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '등록 완료';
  }
});
</script>
</body>
</html>

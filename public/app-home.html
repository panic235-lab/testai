<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>메시지함 - 인력동원상황실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  .leaflet-container { font-family: inherit; }
  .leaflet-marker-icon { background: none; border: none; }
  body {
    --bg: oklch(0.97 0.004 250);
    --bg-card: oklch(1 0 0);
    --bg-muted: oklch(0.955 0.006 250);
    --border: oklch(0.885 0.008 250);
    --text: oklch(0.22 0.02 250);
    --text-dim: oklch(0.48 0.015 250);
    --text-faint: oklch(0.62 0.012 250);
    --blue: oklch(0.56 0.16 240);
    --red: oklch(0.56 0.19 25);
    --amber: oklch(0.68 0.15 80);
    --green: oklch(0.58 0.15 150);
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  }
  a { color: var(--blue); text-decoration: none; }
  .msg-row { display:flex; gap:11px; padding:13px 14px; border-radius:12px; cursor:pointer; align-items:flex-start; }
  .msg-row:hover { background: var(--bg-muted); }
  .wrap { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">

  <div id="listView" style="display:flex; flex-direction:column; flex:1;">
    <div style="padding:18px 20px 12px; flex-shrink:0;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-size:17px; font-weight:800;">메시지함</div>
          <div id="whoLine" style="font-size:11.5px; color:var(--text-faint); margin-top:2px;">-</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div id="avatar" style="width:38px; height:38px; border-radius:50%; background:var(--blue); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff;">-</div>
          <button id="logoutBtn" style="background:none; border:1px solid var(--border); color:var(--text-faint); font-size:10.5px; padding:5px 8px; border-radius:6px; cursor:pointer; font-family:inherit;">로그아웃</button>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:12px; background:oklch(0.94 0.05 150); border-radius:8px; padding:8px 11px; width:fit-content;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:11px; color:oklch(0.4 0.12 150); font-weight:700;">이 기기로 등록됨 · 응소 인정</span>
      </div>
      <div id="statusLine" style="font-size:11.5px; color:var(--text-faint); margin-top:10px;">-</div>
      <div id="geoStatus" style="font-size:10.5px; color:var(--text-faint); margin-top:4px;"></div>
    </div>

    <div id="msgList" style="flex:1; overflow-y:auto; padding:4px 10px 16px;"></div>
  </div>

  <div id="detailView" style="display:none; flex-direction:column; flex:1;">
    <div style="display:flex; align-items:center; gap:10px; padding:16px 18px 8px; flex-shrink:0;">
      <button id="backBtn" style="background:none; border:none; cursor:pointer; color:var(--text-faint); padding:2px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="detailTitle" style="font-size:13.5px; font-weight:700;">-</div>
    </div>

    <div style="flex:1; overflow-y:auto; padding:6px 18px 18px; display:flex; flex-direction:column; gap:14px;">
      <div style="border-radius:12px; overflow:hidden; position:relative; height:210px; background:var(--bg-muted); border:1px solid var(--border); flex-shrink:0;">
        <div id="detailMap" style="position:absolute; inset:0;"></div>
        <div id="detailDistBadge" style="display:none; position:absolute; left:8px; top:8px; z-index:1000; background:rgba(255,255,255,.92); border-radius:8px; padding:4px 8px; font-size:11px; font-weight:700; color:var(--text-dim); box-shadow:0 1px 4px rgba(0,0,0,.12);"></div>
      </div>

      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px;">
        <div style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-dim); line-height:1.5;">
          <div><span style="color:var(--text-faint);">발생시간</span> &nbsp;<span id="detailRecv">-</span></div>
          <div><span style="color:var(--text-faint);">집결지</span> &nbsp;<span id="detailGathering">-</span></div>
          <div><span style="color:var(--text-faint);">내용</span> &nbsp;<span id="detailContent">-</span></div>
        </div>
      </div>

      <div id="detailPhotoWrap" style="display:none;">
        <img id="detailPhoto" style="width:100%; display:block; border-radius:12px; border:1px solid var(--border);" />
      </div>

      <div style="display:flex; align-items:center; gap:8px; padding:11px 13px; background:oklch(0.94 0.05 150); border-radius:10px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:11.5px; color:oklch(0.4 0.12 150); font-weight:700;">이 기기로 로그인 중 — 응소 인정됨</span>
      </div>
    </div>
  </div>

  <div id="consentSheet" style="display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:18px; width:min(424px, calc(100% - 36px)); background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:0 -8px 30px rgba(0,0,0,.12); z-index:20;">
    <div style="font-size:13px; font-weight:700; margin-bottom:4px;">위치정보 제공에 동의해 주세요</div>
    <div style="font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-bottom:12px;">비상근무 시간 동안 응소 확인을 위해 위치정보를 수집합니다. 동의하지 않으면 상황판에는 미수집(추정) 위치로만 표시됩니다.</div>
    <button class="btn" id="consentBtn" style="width:100%; padding:13px; background:var(--blue); color:#fff; font-size:13.5px; border:none; border-radius:10px; cursor:pointer; font-family:inherit; font-weight:700;">동의하고 계속하기</button>
  </div>

</div>
<script>
const $ = (id) => document.getElementById(id);
const READ_KEY = 'accio_app_read_msg_ids';
let me = null;
let messages = [];

function readIds() {
  try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch { return new Set(); }
}
function markRead(id) {
  const set = readIds();
  set.add(id);
  try { localStorage.setItem(READ_KEY, JSON.stringify([...set])); } catch {}
}

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDateTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderList() {
  const read = readIds();
  $('msgList').innerHTML = messages.map((m) => {
    const unread = !read.has(m.id);
    const isDispatch = m.type === 'dispatch';
    const isNotice = m.type === 'notice';
    const iconBg = isDispatch ? 'oklch(0.94 0.04 25)' : isNotice ? 'oklch(0.94 0.05 150)' : 'oklch(0.94 0.03 240)';
    const iconColor = isDispatch ? 'var(--red)' : isNotice ? 'var(--green)' : 'var(--blue)';
    const icon = isDispatch
      ? `<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2 L21 6 V12 C21 17 17 20.5 12 22 C7 20.5 3 17 3 12 V6 Z" stroke="${iconColor}" stroke-width="1.7" stroke-linejoin="round"/></svg>`
      : isNotice
      ? `<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H9l-4 4V5z" stroke="${iconColor}" stroke-width="1.7" stroke-linejoin="round"/></svg>`
      : `<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M4 3v5h5M20 21v-5h-5" stroke="${iconColor}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const previewText = m.preview || (m.photo ? '' : '');
    const photoTag = m.photo ? '📷 사진' + (previewText ? ' · ' : '') : '';
    return `<div class="msg-row" data-open="${m.id}">
      <div style="width:38px; height:38px; border-radius:10px; background:${iconBg}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${icon}</div>
      <div style="flex:1; min-width:0;">
        <div style="display:flex; align-items:center; gap:6px;">
          <div style="font-size:13px; font-weight:${unread ? '700' : '500'};">${m.title}</div>
          ${unread ? '<span style="width:6px; height:6px; border-radius:50%; background:var(--red); flex-shrink:0;"></span>' : ''}
        </div>
        <div style="font-size:11.5px; color:var(--text-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${photoTag}${previewText}</div>
      </div>
      <div style="font-size:10.5px; color:var(--text-faint); flex-shrink:0;">${fmtTime(m.time)}</div>
    </div>`;
  }).join('') || `<div style="padding:60px 20px; text-align:center; font-size:12.5px; color:var(--text-faint); line-height:1.6;">아직 수신한 메시지가 없습니다.<br/>동원명령이 발령되면 이곳에 표시됩니다.</div>`;

  $('msgList').querySelectorAll('[data-open]').forEach((el) => {
    el.addEventListener('click', () => openDetail(Number(el.dataset.open)));
  });
}

const DETAIL_BLUE = 'oklch(0.56 0.16 240)';
const DETAIL_RED = 'oklch(0.56 0.19 25)';
let detailMap = null, detailMeMarker = null, detailTargetMarker = null;

function ensureDetailMap() {
  if (detailMap) return;
  detailMap = L.map('detailMap', { attributionControl: false }).setView([35.8714, 128.6014], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap',
  }).addTo(detailMap);
  L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(detailMap).addAttribution('&copy; OpenStreetMap');
}

function distanceMetersClient(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function renderDetailMap() {
  ensureDetailMap();
  const hasTarget = me && me.targetLat != null && me.targetLng != null;
  const hasMe = me && me.curLat != null && me.curLng != null;

  if (hasTarget) {
    const pos = [me.targetLat, me.targetLng];
    const icon = L.divIcon({
      html: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 21V4h11l-2 4 2 4H6" stroke="${DETAIL_RED}" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
      iconSize: [22, 22], iconAnchor: [4, 21], className: '',
    });
    if (!detailTargetMarker) detailTargetMarker = L.marker(pos, { icon }).addTo(detailMap);
    else { detailTargetMarker.setIcon(icon); detailTargetMarker.setLatLng(pos); }
  } else if (detailTargetMarker) { detailMap.removeLayer(detailTargetMarker); detailTargetMarker = null; }

  if (hasMe) {
    const pos = [me.curLat, me.curLng];
    if (!detailMeMarker) {
      detailMeMarker = L.circleMarker(pos, { radius: 7, color: '#fff', weight: 2.5, fillColor: DETAIL_BLUE, fillOpacity: 1 }).addTo(detailMap);
    } else detailMeMarker.setLatLng(pos);
  } else if (detailMeMarker) { detailMap.removeLayer(detailMeMarker); detailMeMarker = null; }

  if (hasTarget && hasMe) {
    detailMap.fitBounds([[me.targetLat, me.targetLng], [me.curLat, me.curLng]], { padding: [30, 30], maxZoom: 17 });
    const d = Math.round(distanceMetersClient(me.curLat, me.curLng, me.targetLat, me.targetLng));
    $('detailDistBadge').textContent = '집결지까지 약 ' + (d >= 1000 ? (d / 1000).toFixed(1) + 'km' : d + 'm');
    $('detailDistBadge').style.display = 'block';
  } else if (hasTarget) {
    detailMap.setView([me.targetLat, me.targetLng], 15);
    $('detailDistBadge').style.display = 'none';
  } else if (hasMe) {
    detailMap.setView([me.curLat, me.curLng], 15);
    $('detailDistBadge').style.display = 'none';
  } else {
    $('detailDistBadge').style.display = 'none';
  }
  setTimeout(() => { if (detailMap) detailMap.invalidateSize(); }, 0);
}

function openDetail(id) {
  const m = messages.find((x) => x.id === id);
  if (!m) return;
  markRead(id);
  $('detailTitle').textContent = m.title;
  $('detailRecv').textContent = fmtDateTime(m.time);
  $('detailGathering').textContent = (me && me.gatheringEventName) || '지정된 집결지 없음';
  $('detailContent').textContent = m.preview || '-';
  if (m.photo) {
    $('detailPhoto').src = m.photo;
    $('detailPhotoWrap').style.display = 'block';
  } else {
    $('detailPhoto').removeAttribute('src');
    $('detailPhotoWrap').style.display = 'none';
  }
  $('listView').style.display = 'none';
  $('detailView').style.display = 'flex';
  renderList();
  renderDetailMap();
}
$('backBtn').addEventListener('click', () => {
  $('detailView').style.display = 'none';
  $('listView').style.display = 'flex';
});

$('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/app-login.html';
});

let watchId = null;
let geoStarted = false;
let consented = false;

async function postLocation(lat, lng) {
  try {
    const res = await fetch('/api/app/location', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lng }),
    });
    if (res.status === 401) { window.location.href = '/app-login.html'; return; }
  } catch (e) { /* 다음 주기 재시도 */ }
}

function startGeolocation() {
  if (!consented) { $('consentSheet').style.display = 'block'; return; }
  $('consentSheet').style.display = 'none';
  if (geoStarted) return;
  if (!('geolocation' in navigator)) { $('geoStatus').textContent = '이 기기/브라우저는 위치정보를 지원하지 않습니다.'; return; }
  geoStarted = true;
  $('geoStatus').textContent = '📍 위치 전송 중 (비상근무 시간 동안만 수집됩니다)';
  const onPos = (pos) => postLocation(pos.coords.latitude, pos.coords.longitude);
  const onErr = (err) => { $('geoStatus').textContent = '위치 권한이 거부되었거나 오류가 발생했습니다: ' + err.message; };
  navigator.geolocation.getCurrentPosition(onPos, onErr, { enableHighAccuracy: true, timeout: 15000 });
  watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  setInterval(() => navigator.geolocation.getCurrentPosition(onPos, () => {}, { enableHighAccuracy: true, timeout: 15000 }), 30000);
}
function stopGeolocation() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  geoStarted = false;
  $('geoStatus').textContent = '';
  $('consentSheet').style.display = 'none';
}

$('consentBtn').addEventListener('click', () => { consented = true; startGeolocation(); });

async function loadMe() {
  const res = await fetch('/api/app/me');
  if (res.status === 401) { window.location.href = '/app-login.html'; return; }
  me = await res.json();
  $('whoLine').textContent = `${me.name} · ${me.dept || '-'} · ${me.rank || '-'}`;
  $('avatar').textContent = me.name ? me.name[0] : '-';
  $('statusLine').textContent = me.activeStage
    ? `현재 상황단계: ${me.activeStage} · 나의 응소 상태: ${me.status}`
    : '현재 발령된 동원명령이 없습니다.';
  if (me.collectLocation) startGeolocation(); else stopGeolocation();
}

async function loadMessages() {
  const res = await fetch('/api/app/messages');
  if (res.status === 401) { window.location.href = '/app-login.html'; return; }
  const data = await res.json();
  messages = data.messages;
  renderList();
}

async function init() {
  await loadMe();
  await loadMessages();
  setInterval(async () => { await loadMe(); await loadMessages(); }, 20000);
}
init();
</script>
</body>
</html>

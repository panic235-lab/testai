<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>현장 화면 - 인력동원상황실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  .leaflet-container { font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; background: var(--bg-muted); }
  .leaflet-marker-icon { background: none; border: none; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    --bg: oklch(0.97 0.004 250);
    --bg-card: oklch(1 0 0);
    --bg-muted: oklch(0.955 0.006 250);
    --border: oklch(0.885 0.008 250);
    --text: oklch(0.22 0.02 250);
    --text-dim: oklch(0.48 0.015 250);
    --text-faint: oklch(0.62 0.012 250);
    --blue: oklch(0.56 0.16 240);
    --red: oklch(0.56 0.19 25);
    --amber: oklch(0.68 0.15 80);
    --green: oklch(0.58 0.15 150);
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  }
  a { color: var(--blue); text-decoration: none; }
  .btn { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; font-weight: 700; }
  .wrap { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 L21 6 V12 C21 17 17 20.5 12 22 C7 20.5 3 17 3 12 V6 Z" stroke="var(--blue)" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div style="font-size:13px; font-weight:700;" id="nameHeading">인력동원상황실</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:10.5px; color:var(--text-faint); border:1px solid var(--border); border-radius:5px; padding:3px 7px;">웹 접속</span>
      <button class="btn" id="logoutBtn" style="background:none; border:1px solid var(--border); color:var(--text-faint); font-size:10.5px; padding:4px 8px; border-radius:5px;">로그아웃</button>
    </div>
  </div>

  <div id="banner" style="display:none; margin:0 18px 10px; background:oklch(0.95 0.04 80); border-radius:9px; padding:10px 12px; align-items:center; gap:8px; flex-shrink:0;">
    <div style="width:20px; height:20px; border-radius:6px; background:oklch(0.85 0.14 90); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 2 2 7l10 5 10-5-10-5z" stroke="oklch(0.4 0.1 80)" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <div style="flex:1; font-size:11.5px; color:oklch(0.42 0.1 80); font-weight:600;">부여임무가 갱신되었습니다 <span id="updateTime"></span></div>
    <button id="ackBtn" style="background:none; border:none; cursor:pointer; color:oklch(0.5 0.08 80); padding:2px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="noStageCard" style="display:none; margin:40px 18px; text-align:center; color:var(--text-faint); font-size:13px; line-height:1.7;">
    현재 발령된 동원명령이 없습니다.<br/>동원명령이 발령되면 이 화면에 임무·집결지 정보가 표시됩니다.
  </div>

  <div id="mainCard" style="flex:1; overflow-y:auto; padding:0 18px 100px; display:flex; flex-direction:column; gap:14px;">

    <div style="border-radius:12px; overflow:hidden; position:relative; height:230px; background:var(--bg-muted); border:1px solid var(--border); flex-shrink:0;">
      <div id="fieldMap" style="position:absolute; inset:0;"></div>
      <div id="fieldDistBadge" style="display:none; position:absolute; left:8px; top:8px; z-index:1000; background:rgba(255,255,255,.92); border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:10.5px; color:var(--text-dim); font-weight:700;"></div>
      <div style="position:absolute; left:8px; bottom:8px; z-index:1000; background:rgba(255,255,255,.92); border:1px solid var(--border); border-radius:7px; padding:6px 9px; display:flex; gap:10px;">
        <div style="display:flex; align-items:center; gap:4px; font-size:9.5px; color:var(--text-dim);"><span style="width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block;"></span>현위치</div>
        <div style="display:flex; align-items:center; gap:4px; font-size:9.5px; color:var(--text-dim);"><span style="width:7px;height:7px;background:var(--red);display:inline-block;"></span>집결지</div>
      </div>
    </div>

    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; flex-shrink:0;">
      <div style="font-size:11px; color:var(--text-faint); margin-bottom:8px; font-weight:600;">동원명령 내용</div>
      <div style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-dim); line-height:1.5;">
        <div><span style="color:var(--text-faint);">소속</span> &nbsp;<span id="teamVal">-</span></div>
        <div><span style="color:var(--text-faint);">부여임무</span> &nbsp;<span id="missionVal">-</span></div>
        <div><span style="color:var(--text-faint);">위치 최종수신</span> &nbsp;<span id="locVal">아직 위치 미수집</span></div>
      </div>
    </div>

    <div style="border-radius:12px; padding:16px; text-align:center;" id="statusCard">
      <div style="font-size:11px; color:var(--text-faint); margin-bottom:4px;">나의 응소 상태</div>
      <div style="font-size:20px; font-weight:800;" id="statusBadge">-</div>
      <div id="geoStatus" style="font-size:10.5px; color:var(--text-faint); margin-top:6px;">-</div>
    </div>

    <div style="text-align:center; font-size:10.5px; color:var(--text-faint); padding-top:4px;">웹 접속 · 대원 앱 미설치 환경용</div>
  </div>

  <div id="consentSheet" style="display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:18px; width:min(424px, calc(100% - 36px)); background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:0 -8px 30px rgba(0,0,0,.12);">
    <div style="font-size:13px; font-weight:700; margin-bottom:4px;">위치정보 제공에 동의해 주세요</div>
    <div style="font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-bottom:12px;">비상근무 시간 동안 응소 확인을 위해 위치정보를 수집합니다.</div>
    <button class="btn" id="consentBtn" style="width:100%; padding:13px; background:var(--blue); color:#fff; font-size:13.5px;">동의하고 계속하기</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const STATUS = {
  '미응소': { color: 'var(--red)', bg: 'oklch(0.95 0.03 25)', border: 'var(--red)' },
  '접속(이동중)': { color: 'var(--amber)', bg: 'oklch(0.95 0.03 80)', border: 'var(--amber)' },
  '응소(도착)': { color: 'var(--green)', bg: 'oklch(0.94 0.04 150)', border: 'var(--green)' },
};
let lastMissionUpdatedAt = null;
let watchId = null;
let geoStarted = false;
let consented = false;

function fmtTime(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

// ---------- 실제 지도 (OpenStreetMap + Leaflet, 무료/키 불필요) ----------
const FIELD_BLUE = 'oklch(0.56 0.16 240)';
const FIELD_RED = 'oklch(0.56 0.19 25)';
let fieldMap = null;
let fieldMeMarker = null;
let fieldTargetMarker = null;
let fieldFitDone = false;

function ensureFieldMap() {
  if (fieldMap) return;
  fieldMap = L.map('fieldMap', { attributionControl: false }).setView([35.8714, 128.6014], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(fieldMap);
  L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(fieldMap).addAttribution('&copy; OpenStreetMap');
}

// Haversine 거리(m) — geo.js의 서버측 계산과 동일한 공식(클라이언트 표시용)
function distanceMetersClient(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function positionOnMap(me) {
  ensureFieldMap();
  const hasTarget = me.targetLat != null && me.targetLng != null;
  const hasMe = me.curLat != null && me.curLng != null;

  if (hasTarget) {
    if (!fieldTargetMarker) {
      fieldTargetMarker = L.marker([me.targetLat, me.targetLng], {
        icon: L.divIcon({
          className: '',
          html: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 21V4h11l-2 4 2 4H6" stroke="${FIELD_RED}" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
          iconSize: [22, 22], iconAnchor: [4, 21],
        }),
      }).addTo(fieldMap);
    } else {
      fieldTargetMarker.setLatLng([me.targetLat, me.targetLng]);
    }
  }

  if (hasMe) {
    if (!fieldMeMarker) {
      fieldMeMarker = L.circleMarker([me.curLat, me.curLng], {
        radius: 7, color: '#fff', weight: 2.5, fillColor: FIELD_BLUE, fillOpacity: 1,
      }).addTo(fieldMap);
    } else {
      fieldMeMarker.setLatLng([me.curLat, me.curLng]);
    }
  } else if (fieldMeMarker) {
    fieldMap.removeLayer(fieldMeMarker);
    fieldMeMarker = null;
  }

  if (!fieldFitDone && (hasTarget || hasMe)) {
    if (hasTarget && hasMe) {
      fieldMap.fitBounds([[me.targetLat, me.targetLng], [me.curLat, me.curLng]], { padding: [34, 34], maxZoom: 17 });
    } else {
      fieldMap.setView([hasTarget ? me.targetLat : me.curLat, hasTarget ? me.targetLng : me.curLng], 15);
    }
    fieldFitDone = true;
  }
  setTimeout(() => { if (fieldMap) fieldMap.invalidateSize(); }, 0);

  if (hasTarget && hasMe) {
    const d = Math.round(distanceMetersClient(me.curLat, me.curLng, me.targetLat, me.targetLng));
    $('fieldDistBadge').textContent = '집결지까지 약 ' + (d >= 1000 ? (d / 1000).toFixed(1) + 'km' : d + 'm');
    $('fieldDistBadge').style.display = 'block';
  } else {
    $('fieldDistBadge').style.display = 'none';
  }
}

function render(me) {
  $('nameHeading').textContent = `${me.name} (${me.team ? me.team + '조' : '미배정'})`;
  const s = STATUS[me.status] || STATUS['미응소'];
  $('statusBadge').textContent = me.status || '-';
  $('statusBadge').style.color = s.color;
  $('statusCard').style.background = s.bg;
  $('statusCard').style.border = '1.5px solid ' + s.border;
  $('teamVal').textContent = me.team ? me.team + '조 · ' + (me.dept || '-') + ' ' + (me.rank || '') : '-';
  $('missionVal').textContent = me.mission || '(부여된 임무 없음)';
  $('locVal').textContent = me.locUpdatedAt ? fmtTime(me.locUpdatedAt) : '아직 위치 미수집';
  positionOnMap(me);

  if (!me.activeStage) {
    $('noStageCard').style.display = 'block';
    $('mainCard').style.display = 'none';
    $('consentSheet').style.display = 'none';
  } else {
    $('noStageCard').style.display = 'none';
    $('mainCard').style.display = 'flex';
  }

  if (lastMissionUpdatedAt === null) {
    lastMissionUpdatedAt = me.missionUpdatedAt;
  } else if (me.missionUpdatedAt && me.missionUpdatedAt !== lastMissionUpdatedAt) {
    lastMissionUpdatedAt = me.missionUpdatedAt;
    $('updateTime').textContent = '(' + fmtTime(me.missionUpdatedAt) + ')';
    $('banner').style.display = 'flex';
  }

  if (me.collectLocation) startGeolocation(); else stopGeolocation();
}

async function fetchMe() {
  const res = await fetch('/api/field/me');
  if (res.status === 401) { window.location.href = '/field-login.html'; return; }
  const data = await res.json();
  render(data);
}

async function postLocation(lat, lng) {
  try {
    const res = await fetch('/api/field/location', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lng }),
    });
    if (res.status === 401) { window.location.href = '/field-login.html'; return; }
    const data = await res.json();
    render(data);
  } catch (e) { /* 다음 주기 재시도 */ }
}

function startGeolocation() {
  if (!consented) { $('consentSheet').style.display = 'block'; return; }
  $('consentSheet').style.display = 'none';
  if (geoStarted) return;
  if (!('geolocation' in navigator)) { $('geoStatus').textContent = '이 기기/브라우저는 위치정보를 지원하지 않습니다.'; return; }
  geoStarted = true;
  $('geoStatus').textContent = '위치 수집 중 (비상근무 시간 동안만 수집됩니다)';
  const onPos = (pos) => postLocation(pos.coords.latitude, pos.coords.longitude);
  const onErr = (err) => { $('geoStatus').textContent = '위치 권한이 거부되었거나 오류가 발생했습니다: ' + err.message; };
  navigator.geolocation.getCurrentPosition(onPos, onErr, { enableHighAccuracy: true, timeout: 15000 });
  watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  setInterval(() => navigator.geolocation.getCurrentPosition(onPos, () => {}, { enableHighAccuracy: true, timeout: 15000 }), 30000);
}
function stopGeolocation() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  geoStarted = false;
}

$('consentBtn').addEventListener('click', () => { consented = true; startGeolocation(); });
$('ackBtn').addEventListener('click', () => { $('banner').style.display = 'none'; });
$('logoutBtn').addEventListener('click', async () => { await fetch('/api/auth/logout', { method: 'POST' }); window.location.href = '/field-login.html'; });

fetchMe();
setInterval(fetchMe, 15000);
</script>
</body>
</html>
